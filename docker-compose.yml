services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: stocksys-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQLSERVER_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - stocksys-sqlserver-data:/var/opt/mssql
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stocksys-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=StockSysDb;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;"
      Database__ApplyMigrationsOnStartup: "true"
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver
    restart: on-failure
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080

    container_name: stocksys-frontend

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"

    ports:
      - "3001:3001"

    depends_on:
      - api

    restart: unless-stopped

volumes:
  stocksys-sqlserver-data: